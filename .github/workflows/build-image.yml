name: Build and push image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      copa_version:
        description: "copa release tag to bundle (e.g. v0.15.0)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: image/tools/go.mod

      - name: Go test (image/tools)
        working-directory: image/tools
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint ./chart \
            --set harbor.registry=harbor.example.com \
            --set harbor.credentials.username=robot\$test \
            --set harbor.credentials.password=secret

      - name: Compute lowercase image/chart refs
        # GHCR requires lowercase repository paths; github.repository_owner
        # isn't necessarily lowercase (it's the account name as typed).
        id: vars
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/copa-harbor-patcher" >> "$GITHUB_OUTPUT"
          echo "chart_repo=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          # Amd64-only for now — the Dockerfile's copa-fetcher stage already
          # resolves TARGETARCH per platform, but the Go tools stage doesn't
          # yet cross-compile for other target architectures under buildx.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.copa_version && format('COPA_VERSION={0}', inputs.copa_version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chart publishing only happens on an actual version tag (a deliberate
      # release), not on every push to master — an OCI tag is meant to be a
      # specific version, not a constantly-overwritten moving target.
      - name: Package and push chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package ./chart --version "$version" --app-version "$version" -d ./dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "./dist/copa-harbor-patcher-${version}.tgz" "${{ steps.vars.outputs.chart_repo }}"
