{{- if not .Values.harborserver.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copa-harbor.registrySecretName" . }}
  labels:
    {{- include "copa-harbor.labels" . | nindent 4 }}
# Opaque, not kubernetes.io/dockerconfigjson: the docker config.json used for
# registry auth is generated from these plaintext keys at container startup
# (see image/entrypoint.sh), so nothing here needs to carry a precomputed
# .dockerconfigjson. An existingSecret you supply out-of-band only needs the
# same plain keys — username, password, and optionally url.
type: Opaque
stringData:
  # username/password are validated by values.schema.json (required unless
  # harborserver.existingSecret is set), so no template-level `required` here.
  username: {{ .Values.harborserver.credentials.username | quote }}
  password: {{ .Values.harborserver.credentials.password | quote }}
  url: {{ .Values.harborserver.registry | quote }}
{{- end }}
