{{- if not .Values.harbor.existingCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copa-harbor.registrySecretName" . }}
  labels:
    {{- include "copa-harbor.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  # Extra plain keys alongside the standard .dockerconfigjson key, so
  # harbor-report's HTTP Basic auth can reuse the same credentials as the
  # registry push/pull path. If you point harbor.existingCredentialsSecret
  # at a secret you created out-of-band, it must also carry these two keys.
  username: {{ required "harbor.credentials.username is required unless harbor.existingCredentialsSecret is set" .Values.harbor.credentials.username | quote }}
  password: {{ required "harbor.credentials.password is required unless harbor.existingCredentialsSecret is set" .Values.harbor.credentials.password | quote }}
  .dockerconfigjson: |
    {{- $auth := printf "%s:%s" .Values.harbor.credentials.username .Values.harbor.credentials.password | b64enc }}
    {"auths":{ {{ .Values.harbor.registry | quote }}: {"username": {{ .Values.harbor.credentials.username | quote }}, "password": {{ .Values.harbor.credentials.password | quote }}, "auth": {{ $auth | quote }} } } }
{{- end }}
