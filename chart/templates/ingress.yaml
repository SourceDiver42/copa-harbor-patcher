{{- if and (or (eq .Values.mode "webhook") (eq .Values.mode "both")) .Values.webhook.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "copa-harbor.fullname" . }}-webhook
  labels:
    {{- include "copa-harbor.labels" . | nindent 4 }}
spec:
  {{- if .Values.webhook.ingress.className }}
  ingressClassName: {{ .Values.webhook.ingress.className }}
  {{- end }}
  {{- with .Values.webhook.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.webhook.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: {{ include "copa-harbor.fullname" $ }}-webhook
                port:
                  number: {{ $.Values.webhook.service.port }}
    {{- end }}
{{- end }}
