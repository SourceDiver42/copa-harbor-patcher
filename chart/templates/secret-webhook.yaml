{{- if or (eq .Values.mode "webhook") (eq .Values.mode "both") }}
{{- if not .Values.webhook.existingSecret }}
{{- $name := include "copa-harbor.webhookSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.webhook.sharedSecret }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "copa-harbor.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
{{- end }}
