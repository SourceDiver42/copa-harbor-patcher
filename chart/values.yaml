# mode selects which workload(s) this release runs: cronjob | webhook | both
mode: cronjob

image:
  # Published by this repo's CI to GHCR. Override for a private mirror or a
  # locally-loaded dev image (see test/kind, which sets image.pullPolicy=Never).
  repository: ghcr.io/sourcediver42/copa-harbor-patcher
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Pull secrets for the image above — needed if you keep the GHCR package
# private. Each entry is a name of an existing docker-registry secret, e.g.
# imagePullSecrets: [{name: ghcr-creds}].
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# Extra labels/annotations applied to every workload's pod template (the
# CronJob's jobTemplate pod and the webhook Deployment pod).
podLabels: {}
podAnnotations: {}

# Registry this patcher operates against (the Harbor server). Renamed from
# `harbor` — update your values files if upgrading from <0.3.0.
harborserver:
  # Host[:port] of the Harbor registry, no scheme (e.g. "harbor.example.com").
  # Used for bulk.yaml's target.registry and the pushed docker-config secret.
  registry: ""
  # Base URL of Harbor's Core API, e.g. "https://harbor.example.com". Defaults
  # to "https://<harbor.registry>" if left empty.
  apiBase: ""

  # Robot account credentials, supplied directly (see README for the
  # tradeoffs of this vs. existingSecret before pointing this at a real
  # production Harbor). Needs pull+push+list on the target project, since
  # skip-detection does a live tag-list call even for images it ends up
  # skipping. When set, the chart renders an Opaque secret holding these
  # values (plus the registry url); the docker config.json used for registry
  # auth is generated from them at container startup, not baked into the
  # secret.
  credentials:
    username: ""
    password: ""

  # Use a pre-existing secret (e.g. from External Secrets Operator or
  # sealed-secrets) instead of harbor.credentials. It only needs plaintext
  # username + password keys — and, optionally, a url (registry host) key.
  # It does NOT need a precomputed .dockerconfigjson: the docker config.json
  # is inferred from these keys at container startup. Overrides
  # harbor.credentials above.
  existingSecret: ""
  # Key names to read from existingSecret. Leave url empty ("") if the secret
  # carries no registry-host key — the container then falls back to
  # harbor.registry for the docker-config auth host.
  existingSecretKeys:
    username: username
    password: password
    url: url

  # Test-cluster escape hatch: skip TLS verification against Harbor's API
  # entirely (does not affect registry pull/push TLS, only harbor-report's
  # HTTP client). Never enable against a real Harbor.
  insecureSkipVerify: false

buildkit:
  # Left empty, the image defaults based on `rootless`:
  # moby/buildkit:v0.31.1 (rootful) or moby/buildkit:v0.31.1-rootless.
  image: ""
  # Rootful (privileged: true) by default: broader blast radius than
  # rootless, but has no dependency on unprivileged user namespaces being
  # enabled at the kernel level — which several hardened distros (e.g. Talos)
  # disable by default, breaking rootless outright. Set to true only on
  # clusters you've confirmed support it (see README).
  rootless: false
  resources: {}
  # Install QEMU/binfmt emulation (a privileged init container) so the
  # BuildKit worker can patch platforms it can't build natively — e.g. arm64
  # and arm/v7 of a multi-arch image on an amd64-only node. Without this,
  # patching a non-native platform fails with "emulation is not enabled for
  # platform …". Emulated builds are slower, and the init container registers
  # binfmt handlers at the node (kernel) level. Leave false if you only patch
  # the node's native arch (see patch.platforms) or your nodes already provide
  # binfmt. In particular, on Talos with the binfmt system extension (or any
  # cluster running a node-level binfmt DaemonSet), keep this FALSE: the
  # extension already registers QEMU node-wide, and this init container would
  # fail trying to mount binfmt_misc on Talos's locked-down /proc ("cannot
  # mount binfmt_misc filesystem ... no such device").
  emulation: false
  # Image for the emulation init container (only used when emulation: true).
  binfmtImage: "tonistiigi/binfmt:qemu-v9.2.2"

patch:
  # Per-job timeout passed to `copa patch --timeout`.
  timeout: 20m
  # Which platforms of a multi-arch image to patch, e.g.
  # ["linux/amd64","linux/arm64"]. Empty = all platforms present in the image.
  # copa must be able to build each listed platform: that means either a native
  # BuildKit worker for it or QEMU emulation (see buildkit.emulation) — without
  # one, non-native platforms fail with "emulation is not enabled for platform
  # …". Platforms NOT listed are preserved unpatched (and stay vulnerable).
  platforms: []

cronjob:
  schedule: "0 2 * * *"
  # Literal PatchConfig YAML (apiVersion: copa.sh/v1alpha1, kind: PatchConfig).
  # See copacetic's bulk-image-patching docs for the full schema.
  bulkConfig: |
    apiVersion: copa.sh/v1alpha1
    kind: PatchConfig
    target:
      registry: ""
    images: []
  reportsVolume:
    storageClassName: ""
    size: 5Gi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid

webhook:
  replicaCount: 1
  service:
    port: 8443
  existingSecret: ""    # secret with key `token`; overrides sharedSecret below
  sharedSecret: ""       # if empty and existingSecret unset, chart generates one on install
  ingress:
    enabled: false
    className: ""
    hosts: []
    tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Mounted on both the main (copa/webhook) container and the buildkitd
# sidecar — e.g. for a trust-manager-managed CA bundle ConfigMap.
extraVolumes: []
extraVolumeMounts: []

# Extra environment variables, applied to BOTH the main (copa/webhook)
# container and the buildkitd sidecar. This is the integration point for an
# egress HTTP proxy: BuildKit resolves/pulls copa's tooling images (e.g.
# ghcr.io/project-copacetic/copacetic/debian:stable-slim) using the sidecar's
# own environment, so the proxy vars must be set there too, not just on the
# main container. Put your Harbor host (and cluster-internal ranges) in
# NO_PROXY so target-image pulls/pushes stay direct. Set both upper- and
# lower-case forms — different tools read different ones.
# Example:
#   extraEnv:
#     - {name: HTTPS_PROXY, value: "http://proxy.internal:3128"}
#     - {name: HTTP_PROXY,  value: "http://proxy.internal:3128"}
#     - {name: NO_PROXY,    value: "harbor.example.com,.svc,.cluster.local,10.0.0.0/8"}
#     - {name: https_proxy, value: "http://proxy.internal:3128"}
#     - {name: http_proxy,  value: "http://proxy.internal:3128"}
#     - {name: no_proxy,    value: "harbor.example.com,.svc,.cluster.local,10.0.0.0/8"}
extraEnv: []
